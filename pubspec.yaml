name: dbkit
description: >-
  Zero-SQL SQLite toolkit for Dart and Flutter: fluent tables, query
  builder, relations, migrations and typed codegen.
version: 0.4.0
repository: https://github.com/user97116/dbkit
issue_tracker: https://github.com/user97116/dbkit/issues
homepage: https://github.com/user97116/dbkit

environment:
  sdk: ^3.0.0

dependencies:
  sqlite3: ^3.0.0
  meta: ^1.9.0

dev_dependencies:
  build_runner: ^2.4.0
  dbkit_gen:
    path: ../dbkit_gen
  test: ^1.25.0
  lints: ^5.0.0

topics:
  - sqlite
  - database
  - orm
  - query-builder
